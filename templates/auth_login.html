{% extends 'base.html' %}
{% block title %}Sign in | AR Shopping World{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-4 py-14 w-full">
    <form method="post" class="bg-white border border-red-100 rounded-3xl p-7 shadow-sm space-y-4">
    <input type="hidden" name="next" value="{{ next or request.args.get('next') or '' }}">
    <div class="text-center">
      <h1 class="text-2xl font-black">Sign in</h1>
      <p class="text-sm text-slate-500 mt-1">Required for Contact and Sell Product. Shopping can stay guest.</p>
    </div>
    <input required type="email" name="email" placeholder="Email address" class="w-full border rounded-xl p-3 text-sm">
    <input required type="password" name="password" placeholder="Password" class="w-full border rounded-xl p-3 text-sm">
    <button class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Sign in</button>
    <p class="text-xs text-center text-slate-500">No profile yet? <a class="text-red-600 font-bold" href="{{ url_for('register', next=request.args.get('next')) }}">Create one</a></p>
  </form>
</main>
{% endblock %}
