{% extends 'base.html' %}
{% block title %}Create profile | AR Shopping World{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-4 py-14 w-full">
  <form method="post" class="bg-white border border-red-100 rounded-3xl p-7 shadow-sm space-y-4">
    <div class="text-center">
      <h1 class="text-2xl font-black">Create your profile</h1>
      <p class="text-sm text-slate-500 mt-1">Needed to contact support or list a product for sale.</p>
    </div>
    <input required name="name" maxlength="100" placeholder="Full name" class="w-full border rounded-xl p-3 text-sm">
    <input required type="email" name="email" placeholder="Email address" class="w-full border rounded-xl p-3 text-sm">
    <input required type="password" name="password" minlength="6" placeholder="Password (min 6 characters)" class="w-full border rounded-xl p-3 text-sm">
    <button class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Create profile</button>
    <p class="text-xs text-center text-slate-500">Already have a profile? <a class="text-red-600 font-bold" href="{{ url_for('login', next=request.args.get('next')) }}">Sign in</a></p>
  </form>
</main>
{% endblock %}
